# JVM settings for the Gradle daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# Android
android.useAndroidX=true
# Only build the unit-test variant of the build type under test (debug) -> faster.
android.onlyEnableUnitTestForTheTestedBuildType=true
# R8 full mode (AGP default since 8.0; stated explicitly so the release keep rules are written for it).
android.enableR8.fullMode=true

# App version: the single source for versionName/versionCode. Release tags must be v$VERSION_NAME
# (checked by .woodpecker/release.yml).
VERSION_NAME=0.1.0
VERSION_CODE=1

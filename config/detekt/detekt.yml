# detekt configuration. Rules not listed here fall back to detekt's defaults
# (buildUponDefaultConfig = true in build-logic/.../KumaQualityConventionPlugin.kt).
# Formatting is handled by ktlint, so detekt's formatting wrapper is not applied.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated: ['Composable', 'Inject', 'Provides']
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable', 'Preview', 'Test']
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    ignorePrivate: true
    ignoreOverridden: true
  CyclomaticComplexMethod:
    threshold: 18
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*'
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
    ignoreNumbers: ['-1', '0', '1', '2', '100', '1000']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  UnusedParameter:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Forbidden FIXME todo marker in comment, please fix the problem.'
        value: 'FIXME:'
      - reason: 'Forbidden STOPSHIP todo marker in comment, please address the problem before shipping the code.'
        value: 'STOPSHIP:'
  WildcardImport:
    active: true
    excludeImports: []
  UnnecessaryAbstractClass:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false

coroutines:
  InjectDispatcher:
    active: true
    dispatcherNames: ['IO', 'Default', 'Unconfined']

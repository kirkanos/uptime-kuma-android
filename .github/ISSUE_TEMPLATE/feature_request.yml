name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could the app help? Mockups or examples from Kuma's web UI are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Kuma's web UI can already do this (the app should follow its behaviour)
        - label: This needs no third-party service besides Kuma and ntfy

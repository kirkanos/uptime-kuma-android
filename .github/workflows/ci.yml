name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with dependency and build cache)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check translations (values vs values-de)
        run: python3 scripts/check-translations.py

      - name: Check regex literals for Android (ICU) compatibility
        run: python3 scripts/check-android-regex.py

      - name: ktlint, detekt, lint, build debug APK, unit tests
        run: ./gradlew ktlintCheck detekt lintDebug assembleDebug testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-build
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  release-build:
    # Builds the minified release exactly like the release workflow, but signed with the throwaway debug
    # key (no secrets on pull requests), so R8 / resource shrinking problems show up before a tag.
    name: Minified release build (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with dependency and build cache)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: assembleRelease (R8 full mode) and compile the baseline profile module
        run: ./gradlew assembleRelease :baselineprofile:assemble -PsignReleaseWithDebugKey=true --stacktrace

      - name: APK size
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BYTES=$(stat -c %s "$APK")
          echo "Release APK: $BYTES bytes ($((BYTES / 1024)) KiB)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK and R8 mapping
        uses: actions/upload-artifact@v5
        with:
          name: app-release-debug-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/usage.txt
            app/build/outputs/mapping/release/configuration.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports-release-build
          path: '**/build/reports/'
          if-no-files-found: ignore

  integration:
    # Runs the @Tag("integration") tests of :core:kuma-client and :core:data against a real Kuma, seeded
    # with infra/kuma-seed. 2.5.8 is the reference (fixtures and API docs); 2.4.x is checked for
    # compatibility but may fail without blocking the pipeline (see README "Compatibility").
    name: Integration tests (Kuma ${{ matrix.kuma }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: ${{ matrix.allowed-to-fail }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kuma: "2.5.8"
            allowed-to-fail: false
          - kuma: "2.4.0"
            allowed-to-fail: true
    services:
      kuma:
        image: louislam/uptime-kuma:${{ matrix.kuma }}
        env:
          # Skip the 2.x "choose your database" page and go straight to the setup flow.
          UPTIME_KUMA_DB_TYPE: sqlite
        ports:
          - 3001:3001
        options: >-
          --health-cmd "extra/healthcheck"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 18
          --health-start-period 30s
    env:
      KUMA_URL: http://localhost:3001
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/kuma-seed/package-lock.json

      - name: Create the admin user and seed monitors
        working-directory: infra/kuma-seed
        run: |
          npm ci
          node setup.mjs > /dev/null
          node seed.mjs
          # Let the seeded monitors produce heartbeats (20 s interval; failing monitor goes PENDING -> DOWN).
          sleep 45

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with dependency and build cache)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Integration tests
        run: >-
          ./gradlew :core:kuma-client:integrationTest :core:data:testDebugUnitTest -Pintegration
          --continue --stacktrace

      - name: Kuma log
        if: failure()
        run: docker logs "${{ job.services.kuma.id }}" 2>&1 | tail -200

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-integration-kuma-${{ matrix.kuma }}
          path: |
            core/kuma-client/build/reports/
            core/kuma-client/build/test-results/
            core/data/build/reports/
            core/data/build/test-results/
          if-no-files-found: ignore

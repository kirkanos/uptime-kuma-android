name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Tag must match VERSION_NAME
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tags must look like vX.Y.Z, got '$GITHUB_REF_NAME'."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$VERSION_NAME in gradle.properties."
            exit 1
          fi
          echo "Releasing $VERSION_NAME (versionCode $(sed -n 's/^VERSION_CODE=//p' gradle.properties))"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set; refusing to publish an unsigned release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK and compute checksum
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="uptime-kuma-android-${VERSION}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          # R8 mapping to de-obfuscate stack traces users report.
          cp app/build/outputs/mapping/release/mapping.txt "uptime-kuma-android-${VERSION}-mapping.txt"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "mapping=uptime-kuma-android-${VERSION}-mapping.txt" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$KEYSTORE_FILE"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
            ${{ steps.apk.outputs.mapping }}

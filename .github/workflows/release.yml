name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed APKs (full + foss) and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Tag must match VERSION_NAME
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tags must look like vX.Y.Z, got '$GITHUB_REF_NAME'."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$VERSION_NAME in gradle.properties."
            exit 1
          fi
          echo "Releasing $VERSION_NAME (versionCode $(sed -n 's/^VERSION_CODE=//p' gradle.properties))"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set; refusing to publish an unsigned release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

      - name: Build release APKs (full + foss)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleFossDebug --stacktrace

      - name: foss APK must not contain Firebase / Google Play services classes
        # Checked on the unminified foss debug build (same dependencies, no R8 renaming).
        run: python3 scripts/check-foss-apk.py app/build/outputs/apk/foss/debug/app-foss-debug.apk

      - name: Rename APKs and compute checksums
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FULL="uptime-kuma-android-${VERSION}.apk"
          FOSS="uptime-kuma-android-${VERSION}-foss.apk"
          mv app/build/outputs/apk/full/release/app-full-release.apk "$FULL"
          mv app/build/outputs/apk/foss/release/app-foss-release.apk "$FOSS"
          # R8 mappings to de-obfuscate stack traces users report.
          cp app/build/outputs/mapping/fullRelease/mapping.txt "uptime-kuma-android-${VERSION}-mapping.txt"
          cp app/build/outputs/mapping/fossRelease/mapping.txt "uptime-kuma-android-${VERSION}-foss-mapping.txt"
          sha256sum "$FULL" > "$FULL.sha256"
          sha256sum "$FOSS" > "$FOSS.sha256"
          cat "$FULL.sha256" "$FOSS.sha256"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "foss=$FOSS" >> "$GITHUB_OUTPUT"
          echo "mapping=uptime-kuma-android-${VERSION}-mapping.txt" >> "$GITHUB_OUTPUT"
          echo "foss_mapping=uptime-kuma-android-${VERSION}-foss-mapping.txt" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$KEYSTORE_FILE"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.apk.outputs.full }}
            ${{ steps.apk.outputs.full }}.sha256
            ${{ steps.apk.outputs.foss }}
            ${{ steps.apk.outputs.foss }}.sha256
            ${{ steps.apk.outputs.mapping }}
            ${{ steps.apk.outputs.foss_mapping }}
